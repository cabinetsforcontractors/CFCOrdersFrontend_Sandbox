<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sort Order Review Tool — WS17</title>
<style>
  :root {
    --bg:#f8f9fa;--surface:#fff;--border:#dee2e6;
    --header-bg:#e9ecef;--header-fg:#343a40;
    --cat-base:#d4edda;--cat-wall:#cce5ff;--cat-tall:#fff3cd;
    --cat-vanity:#f8d7da;--cat-trim:#e2d9f3;
    --row-hover:#f1f3f5;--accent:#0d6efd;--muted:#6c757d;
    --badge-bg:#6c757d;--badge-fg:#fff;--zero-badge:#dc3545;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:#212529;font-size:13px;}
  #toolbar{
    position:sticky;top:0;z-index:100;
    background:var(--surface);border-bottom:1px solid var(--border);
    padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  #toolbar h1{font-size:15px;font-weight:700;color:var(--header-fg);}
  .stats{font-size:12px;color:var(--muted);}
  #search{margin-left:auto;padding:5px 10px;border:1px solid var(--border);border-radius:4px;font-size:12px;width:220px;}
  .btn{padding:5px 12px;border-radius:4px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;font-weight:600;color:var(--header-fg);}
  .btn:hover{background:var(--header-bg);}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-primary:hover{background:#0b5ed7;}
  #main{padding:12px 16px;max-width:1200px;margin:0 auto;}
  .group-card{margin-bottom:8px;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .group-header{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;user-select:none;background:var(--header-bg);border-bottom:1px solid var(--border);}
  .group-header:hover{background:#dde0e3;}
  .toggle{font-size:11px;color:var(--muted);width:14px;}
  .cat-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.5px;}
  .cat-Base{background:var(--cat-base);color:#155724;}
  .cat-Wall{background:var(--cat-wall);color:#004085;}
  .cat-Tall{background:var(--cat-tall);color:#856404;}
  .cat-Vanity{background:var(--cat-vanity);color:#721c24;}
  .cat-Trim{background:var(--cat-trim);color:#4a235a;}
  .group-label{font-weight:600;font-size:13px;flex:1;}
  .row-count{font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--badge-bg);color:var(--badge-fg);}
  .row-count.zero{background:var(--zero-badge);}
  .group-id{font-size:10px;color:var(--muted);font-family:monospace;}
  .group-body{background:var(--surface);}
  .group-body.collapsed{display:none;}
  table{width:100%;border-collapse:collapse;}
  th{background:#f1f3f5;font-size:11px;font-weight:700;text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  td{padding:4px 8px;border-bottom:1px solid #f1f3f5;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--row-hover);}
  .col-num{width:38px;color:var(--muted);font-size:11px;text-align:right;}
  .col-sgfc{font-family:monospace;font-size:12px;font-weight:600;width:280px;}
  .col-code{font-family:monospace;font-size:11px;color:var(--muted);width:80px;}
  .desc-input{width:100%;padding:3px 6px;border:1px solid transparent;border-radius:3px;font-size:12px;background:transparent;font-family:var(--font);}
  .desc-input:focus{outline:none;border-color:var(--accent);background:#fff;}
  .desc-input.saved{background:#d4edda;transition:background 1s;}
</style>
</head>
<body>
<div id="toolbar">
  <h1>Sort Order Review — WS17</h1>

  <input type="text" id="search" placeholder="Search SGFC or group&hellip;" oninput="applySearch(this.value)">
  <button class="btn btn-primary" onclick="exportCSV()">Export CSV</button>
  <button class="btn" onclick="clearStorage()">Reset Storage</button>
</div>

const LS_KEY='ws17_sort_order_v2';
function loadSaved(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'{}');}catch{return{};}}
function saveSaved(d){try{localStorage.setItem(LS_KEY,JSON.stringify(d));}catch{}}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(q){
  const saved=loadSaved();q=(q||'').toLowerCase().trim();
  const main=document.getElementById('main');main.innerHTML='';
  let vg=0,vr=0;
  GROUPS.forEach((g,gi)=>{
    const fr=g.rows.filter(r=>!q||r.sgfc.toLowerCase().includes(q)||g.label.toLowerCase().includes(q)||g.id.includes(q));
    if(q&&fr.length===0)return;vg++;vr+=fr.length;
    const catKey=g.cat.replace('/Accessory','').replace('/','');
    const card=document.createElement('div');card.className='group-card';
    card.innerHTML=`<div class="group-header" onclick="tog(${gi})">
      <span class="toggle" id="t${gi}">▼</span>
      <span class="cat-badge cat-${catKey}">${g.cat.split('/')[0]}</span>
      <span class="group-label">${esc(g.label)}</span>
      <span class="row-count${fr.length===0?' zero':''}">${fr.length}</span>
      <span class="group-id">${esc(g.id)}</span>
    </div>
    <div class="group-body" id="b${gi}">
      ${fr.length>0?buildTable(gi,fr,saved):'<p style="padding:8px 12px;color:#6c757d;font-size:12px;">No rows</p>'}
    </div>`;
    main.appendChild(card);
  });
  document.getElementById('stats-label').textContent=q?`${vg} groups · ${vr} rows (filtered)`:`${vg} groups · ${vr} rows`;
}
function buildTable(gi,rows,saved){
  let h='<table><thead><tr><th class="col-num">#</th><th class="col-sgfc">SGFC</th><th class="col-code">Sort Code</th><th>norm_desc (editable)</th></tr></thead><tbody>';
  rows.forEach((r,i)=>{
    const d=saved[r.sgfc]!==undefined?saved[r.sgfc]:r.norm_desc;
    h+=`<tr><td class="col-num">${i+1}</td><td class="col-sgfc">${esc(r.sgfc)}</td><td class="col-code">${esc(r.brand_sort_code)}</td>
    <td><input class="desc-input" data-sgfc="${esc(r.sgfc)}" value="${esc(d)}" onchange="saveDesc(this)" placeholder="—"></td></tr>`;
  });
  return h+'</tbody></table>';
}
function saveDesc(el){const s=loadSaved();s[el.dataset.sgfc]=el.value;saveSaved(s);el.classList.add('saved');setTimeout(()=>el.classList.remove('saved'),1200);}
function tog(gi){const b=document.getElementById('b'+gi),t=document.getElementById('t'+gi);if(!b)return;b.classList.toggle('collapsed');t.textContent=b.classList.contains('collapsed')?'▶':'▼';}
function collapseAll(){GROUPS.forEach((_,gi)=>{const b=document.getElementById('b'+gi),t=document.getElementById('t'+gi);if(b)b.classList.add('collapsed');if(t)t.textContent='▶';})}
function expandAll(){GROUPS.forEach((_,gi)=>{const b=document.getElementById('b'+gi),t=document.getElementById('t'+gi);if(b)b.classList.remove('collapsed');if(t)t.textContent='▼';})}
let st;function applySearch(q){clearTimeout(st);st=setTimeout(()=>render(q),200);}
function exportCSV(){
  const saved=loadSaved();
  const lines=['"sort_group_fb_canonical","category","sort_group","brand_sort_code","norm_desc"'];
  GROUPS.forEach(g=>g.rows.forEach(r=>{
    const d=saved[r.sgfc]!==undefined?saved[r.sgfc]:r.norm_desc;
    const e=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
    lines.push([e(r.sgfc),e(g.cat),e(g.id),e(r.brand_sort_code),e(d)].join(','));
  }));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));
  a.download='sort_order_reviewed.csv';a.click();
}
function clearStorage(){if(confirm('Clear all saved norm_desc values?')){localStorage.removeItem(LS_KEY);render(document.getElementById('search').value);}}
